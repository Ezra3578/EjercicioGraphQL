# Archivo: docker-compose.yml

services:

  # Servicio 1: la aplicación Node.js
  cliente-api:
    # Construye la imagen desde el Dockerfile en la carpeta actual
    image: microservicio-cliente

    build: cliente-api/
    # Publica el puerto 3001 del contenedor en el puerto 3001 del cliente
    ports:
      - "3001:3001" # Cliente
    # Variables de entorno disponibles dentro del contenedor
    env_file:
      - ./cliente-api/.env

    depends_on:
      - postgres-bd

    # Reinicia el contenedor si falla
    restart: unless-stopped

  producto-api:
    # Construye la imagen desde el Dockerfile en la carpeta actual
    image: microservicio-producto

    build: producto-api/
    # Publica el puerto 3001 del contenedor en el puerto 3001 del cliente
    ports:
      - "3002:3001" # Cliente
    # Variables de entorno disponibles dentro del contenedor
    env_file:
      - ./producto-api/.env

    depends_on:
      - postgres-bd

    # Reinicia el contenedor si falla
    restart: unless-stopped

  compra-api:
    # Construye la imagen desde el Dockerfile en la carpeta actual
    image: microservicio-compra

    build: compra-api/
    # Publica el puerto 3001 del contenedor en el puerto 3001 del cliente

    ports:
      - "3003:3001" # Cliente
    # Variables de entorno disponibles dentro del contenedor
    env_file:
      - ./compra-api/.env

    depends_on:
      - cliente-api
      - producto-api
      - postgres-bd

    # Reinicia el contenedor si falla
    restart: unless-stopped

  postgres-bd:
    image: postgres:16-alpine
    container_name: microservicios_bd

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microservices

    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

    restart: always

volumes:
  pgdata:
